[package]
name = "superfile"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "superfile"
path = "src/main.rs"

[[bench]]
name = "minimap_edit"
path = "benches/minimap_edit.rs"
harness = false

[features]
reader-measurements = ["gpui-kit/profiler"]

[dependencies]
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
log = "0.4"
superfile-core.workspace = true
superfile-services.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url = "2"
serde_json = "1"
arboard = { version = "=3.6.1", default-features = false }

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_UI_Shell"] }
windows-collections = "=0.3.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "=0.37.0", default-features = false }

# Unsafe is confined to native desktop bridges.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
