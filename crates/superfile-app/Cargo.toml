[package]
name = "superfile"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "superfile"
path = "src/main.rs"

[[bench]]
name = "minimap_edit"
path = "benches/minimap_edit.rs"
harness = false

[features]
reader-measurements = ["gpui-kit/profiler"]

[dependencies]
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
log = "0.4"
superfile-core.workspace = true
superfile-services.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "=0.37.0", default-features = false }

# Unsafe is confined to the main-thread native view, context-menu, path-hint and updater bridges.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
