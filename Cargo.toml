[workspace]
members = [
    "crates/superfile-core",
    "crates/superfile-services",
    "crates/superfile-app",
]
default-members = ["crates/superfile-app"]
resolver = "3"

[workspace.package]
version = "0.1.4"
authors = ["superwindcloud"]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
superfile-core = { path = "crates/superfile-core" }
superfile-services = { path = "crates/superfile-services" }
gpui-kit = { version = "=0.7.1", features = [
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-toml",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-swift",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-java",
    "tree-sitter-sql",
    "tree-sitter-make",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-csharp",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-scala",
    "tree-sitter-elixir",
    "tree-sitter-zig",
    "tree-sitter-graphql",
    "tree-sitter-proto",
    "tree-sitter-cmake",
    "tree-sitter-astro",
    "tree-sitter-svelte",
    "tree-sitter-erb",
    "tree-sitter-ejs",
    "tree-sitter-jsdoc",
] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
# Omit symbol generation from the default edit/build/run loop.
debug = 0

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.package.superfile]
# Split the final executable's codegen without increasing dependency build work.
codegen-units = 8

# PdfCraft uses APIs from its pinned rendering and PDF parser patches.
[patch.crates-io]
# Office patches are based on clark-labs-inc/libreoffice-rs at cfce6055320db3c4e93f462a403476d45e137cb7.
# Share imported XML subtrees and retain Unicode text when embedding Office fonts.
lo_core = { path = "vendor/lo_core" }
# Preserve Word page and table geometry and image aspect ratios in generated pages.
lo_writer = { path = "vendor/lo_writer" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
