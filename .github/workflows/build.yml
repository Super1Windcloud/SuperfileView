name: Superfile Release Builds

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and determine release type
        id: version
        run: python scripts/package/release.py version "$RELEASE_TAG"

  build:
    name: Build (${{ matrix.platform_name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      BUILD_TARGET: ${{ matrix.target }}
      PACKAGE_ARCH: ${{ matrix.arch_label }}
      PACKAGE_PLATFORM: ${{ matrix.platform_name }}
      SUPERFILE_BUILD_CHANNEL: release
      SUPERFILE_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      # Bundle the MSVC runtime into the Windows executable for fresh installs.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform_name: windows-x86_64
            arch_label: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform_name: macos-aarch64
            arch_label: aarch64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x86_64
            arch_label: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Restore Rust release cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev dpkg-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libvulkan-dev
      - name: Set application version from tag
        run: python scripts/package/release.py prepare "$RELEASE_TAG"
      - name: Build release binary
        run: cargo build --release --locked -p superfile --target "$BUILD_TARGET"

      - name: Locate NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # windows-2022 includes NSIS; avoid an unneeded external installer download.
          $nsisHome = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisHome 'makensis.exe'))) {
            throw 'The Windows runner is missing its bundled NSIS installation'
          }
          "NSIS_HOME=$nsisHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package/windows/package-windows.ps1 -Target $env:BUILD_TARGET -Tag $env:RELEASE_TAG
      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: bash scripts/package/macos/package-dmg.sh "$BUILD_TARGET" "$PACKAGE_ARCH" "$RELEASE_TAG"
      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: bash scripts/package/linux/package-deb.sh "$BUILD_TARGET" "$RELEASE_TAG"
      - name: Require both installer and portable package
        run: python scripts/package/release.py verify "$RELEASE_TAG" --platform "$PACKAGE_PLATFORM"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform_name }}
          path: package-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Require all six packages and generate SHA256 checksums
        run: python scripts/package/release.py verify "$RELEASE_TAG" --directory dist --checksums
      - name: Generate and validate the static update manifest
        run: |
          python scripts/package/release.py manifest "$RELEASE_TAG" --directory dist --repository "$GITHUB_REPOSITORY"
          python scripts/package/release.py verify "$RELEASE_TAG" --directory dist --checksums --manifest --repository "$GITHUB_REPOSITORY"
      - name: Create GitHub Release and upload packages
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Superfile ${{ needs.prepare.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'legacy' }}
      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {path.name: path.stat().st_size for path in Path('dist').iterdir()}
          uploaded = json.loads(Path('release-assets.json').read_text())['assets']
          actual = {asset['name']: asset['size'] for asset in uploaded}
          if actual != expected:
              raise SystemExit(f'Release asset mismatch: expected={expected}, actual={actual}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Published {len(expected)} assets: {os.environ['RELEASE_URL']}\n")
          PY
