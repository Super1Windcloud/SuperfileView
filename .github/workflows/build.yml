name: Superfile desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: python scripts/check-locales.py
      - run: python scripts/check-architecture.py
      - run: cargo build --locked -p superfile --target ${{ matrix.target }}
      - run: cargo test --locked -p superfile-services --test portable_documents --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: superfile-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debug/superfile
            target/${{ matrix.target }}/debug/superfile.exe
          if-no-files-found: error
